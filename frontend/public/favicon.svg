<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Degradado Cherry (de rojo cereza vibrante a cereza oscuro) -->
    <linearGradient id="cherryGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#6B0022" />
    </linearGradient>
  </defs>

  <!-- Fondo Negro Sólido -->
  <rect width="100" height="100" rx="18" fill="#0a0a0c" />
  
  <!-- Círculo superior (El sol/luna con degradado cherry) -->
  <circle cx="50" cy="42" r="26" fill="url(#cherryGradient)" />
  
  <!-- El "Agua Negra" (Corta el círculo a la mitad) -->
  <rect x="0" y="52" width="100" height="48" fill="#0a0a0c" />
  
  <!-- Ondas/Reflejos de agua con degradado cherry -->
  <rect x="24" y="62" width="52" height="6" fill="url(#cherryGradient)" />
  <rect x="36" y="76" width="28" height="6" fill="url(#cherryGradient)" />
</svg>
